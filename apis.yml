aid: spree-commerce
url: https://raw.githubusercontent.com/api-evangelist/spree-commerce/refs/heads/main/apis.yml
name: Spree Commerce
kind: opensource
description: >-
  Spree Commerce is an open-source headless eCommerce platform originally
  released in 2007 and built on Ruby on Rails. The Spree server exposes a
  modern Store API (v3), an Admin API (v3), a Platform API (v2) used by
  internal/back-office integrations, and a Storefront API (v2) based on the
  JSON:API spec - all described with OpenAPI 3 - plus an OAuth 2.0 token
  endpoint for authentication. Developer surface includes the TypeScript Store
  and Admin SDKs (@spree/sdk and @spree/admin-sdk), the @spree/cli for managing
  Spree projects, the create-spree-app scaffolder, the open-source Next.js
  storefront, the spree-starter application template, the spree_extension
  generator for building Rails extensions, the deface view-customization
  plugin, official payments integrations (Stripe, Adyen, PayPal), marketing
  integrations (Klaviyo, Google Analytics), an Avalara/AvaTax extension, the
  spree_multi_vendor marketplace extension, and a Webhook event system for
  reacting to store events.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
  - Commerce
  - Headless
  - eCommerce
  - Open Source
  - Ruby on Rails
  - Ruby
  - TypeScript
created: '2026-05-25'
modified: '2026-05-25'
specificationVersion: '0.19'
apis:
  - aid: spree-commerce:store-api
    name: Spree Store API
    description: >-
      Public Spree Store API v3 - the modern customer-facing REST API used by
      headless storefronts, mobile apps, and integrations. Covers products,
      variants, collections, taxonomies, cart and order flows, checkout,
      payments, account, and search. Described with OpenAPI 3.
    humanURL: https://dev-docs.spreecommerce.org/api-reference/store-api/introduction
    baseURL: https://demo.spreecommerce.org
    tags:
      - REST
      - Storefront
      - Carts
      - Orders
      - Products
    properties:
      - type: Documentation
        url: https://dev-docs.spreecommerce.org/api-reference/store-api/introduction
      - type: OpenAPI
        url: openapi/spree-commerce-store-api-openapi.yml
      - type: OpenAPI
        url: https://raw.githubusercontent.com/spree/spree/main/docs/api-reference/store.yaml
  - aid: spree-commerce:admin-api
    name: Spree Admin API
    description: >-
      Spree Admin API v3 - administrative REST API for managing products,
      orders, customers, payments, shipping, and store configuration.
      Authenticated via a secret API key passed in the x-spree-api-key header
      and used by the Spree Admin dashboard and back-office automation.
    humanURL: https://dev-docs.spreecommerce.org/api-reference/admin-api/introduction
    baseURL: https://demo.spreecommerce.org
    tags:
      - REST
      - Admin
      - Back-Office
      - Orders
      - Products
    properties:
      - type: Documentation
        url: https://dev-docs.spreecommerce.org/api-reference/admin-api/introduction
      - type: OpenAPI
        url: openapi/spree-commerce-admin-api-openapi.yml
      - type: OpenAPI
        url: https://raw.githubusercontent.com/spree/spree/main/docs/api-reference/admin.yaml
  - aid: spree-commerce:platform-api
    name: Spree Platform API
    description: >-
      Spree Platform API v2 - the broad REST API that backs the legacy admin
      and platform-level integrations. Provides full CRUD coverage of the Spree
      data model including addresses, taxons, classifications, line items,
      payments, refunds, shipments, stock items, and platform configuration.
      Authenticated with OAuth 2.0 bearer tokens.
    humanURL: https://dev-docs.spreecommerce.org/api-reference/platform-api/introduction
    baseURL: https://demo.spreecommerce.org
    tags:
      - REST
      - Platform
      - Admin
    properties:
      - type: Documentation
        url: https://dev-docs.spreecommerce.org/api-reference/platform-api/introduction
      - type: OpenAPI
        url: openapi/spree-commerce-platform-api-openapi.yml
      - type: OpenAPI
        url: https://raw.githubusercontent.com/spree/spree/main/docs/api-reference/platform.yaml
  - aid: spree-commerce:storefront-api
    name: Spree Storefront API (JSON:API)
    description: >-
      Spree Storefront API v2 - the JSON:API-compliant REST API used by Spree's
      reference Next.js and Rails storefronts. Includes account, addresses,
      cart, checkout, products, taxons, orders, payments, store credits, and
      gift cards. Distributed as an OpenAPI 3 specification.
    humanURL: https://dev-docs.spreecommerce.org/api-reference/storefront-api/introduction
    baseURL: https://demo.spreecommerce.org
    tags:
      - REST
      - JSON API
      - Storefront
      - Checkout
    properties:
      - type: Documentation
        url: https://dev-docs.spreecommerce.org/api-reference/storefront-api/introduction
      - type: OpenAPI
        url: openapi/spree-commerce-storefront-api-openapi.yml
      - type: OpenAPI
        url: https://raw.githubusercontent.com/spree/spree/main/docs/api-reference/storefront.yaml
  - aid: spree-commerce:oauth-api
    name: Spree OAuth API
    description: >-
      OAuth 2.0 token endpoint used to create and refresh short-lived bearer
      tokens for the Spree Storefront, Platform, and Admin APIs. Supports
      password, client_credentials, and refresh_token grants on the
      /spree_oauth/token path.
    humanURL: https://dev-docs.spreecommerce.org/api-reference/authentication
    baseURL: https://demo.spreecommerce.org
    tags:
      - OAuth
      - Authentication
      - Tokens
    properties:
      - type: Documentation
        url: https://dev-docs.spreecommerce.org/api-reference/authentication
      - type: OpenAPI
        url: openapi/spree-commerce-oauth-api-openapi.yml
      - type: OpenAPI
        url: https://raw.githubusercontent.com/spree/spree/main/docs/api-reference/oauth.yml
  - aid: spree-commerce:webhooks
    name: Spree Webhooks
    description: >-
      Outbound webhook event system - the Spree server emits signed JSON
      payloads for order, product, customer, payment, and shipment lifecycle
      events. The webhook envelope carries an id, event name, created_at,
      data, and metadata block, with payloads sharing the Store API v3
      serializers.
    humanURL: https://dev-docs.spreecommerce.org/api-reference/webhooks-events
    baseURL: https://dev-docs.spreecommerce.org/api-reference/webhooks-events
    tags:
      - Webhooks
      - Events
      - Notifications
    properties:
      - type: Documentation
        url: https://dev-docs.spreecommerce.org/api-reference/webhooks-events
      - type: Documentation
        url: https://dev-docs.spreecommerce.org/developer/core-concepts/webhooks
