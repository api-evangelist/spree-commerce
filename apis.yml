    name: Spree Webhooks
    description: >-
      Outbound webhook event system - the Spree server emits signed JSON payloads for order, product, customer,
      payment, and shipment lifecycle events. The webhook envelope carries an id, event name, created_at,
      data, and metadata block, with payloads sharing the Store API v3 serializers.
    humanURL: https://dev-docs.spreecommerce.org/api-reference/webhooks-events
    baseURL: https://dev-docs.spreecommerce.org/api-reference/webhooks-events
    tags:
