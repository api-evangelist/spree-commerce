    name: '@spree/admin-sdk (TypeScript Admin API SDK)'
    description: >-
      Official TypeScript SDK for the Spree Admin API. Provides a typed client
      for managing products, orders, customers, and store configuration from
      Node.js services and admin tools.
    humanURL: https://www.npmjs.com/package/@spree/admin-sdk
    baseURL: https://github.com/spree/spree/tree/main/packages/admin-sdk
    tags:
