specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Spree Commerce
providerId: spree-commerce
created: '2026-05-25'
modified: '2026-05-25'
tags:
- Commerce
- Headless
- eCommerce
- Open Source
- Ruby on Rails
- Ruby
- TypeScript
description: >-
  Machine-readable plans scaffold for the Spree Commerce API surface. Spree
  itself is free, open-source software (BSD-3-Clause for spree/spree) with no
  per-call API fees; commercial tiers exist for Spree Enterprise and Spree
  Cloud and are reconciled against published terms at
  https://spreecommerce.org/pricing/.
plans:
- id: spree-commerce-community
  name: Spree Community
  type: opensource
  description: >-
    Free, self-hosted, open-source Spree Commerce. No per-call API limits or
    fees - capacity is bound by the operator's own infrastructure.
  entries:
  - label: API Requests
    description: Self-hosted; no provider-enforced quota on API calls.
    name: api_requests
    type: quota
    metric: requests
    limit: 0
    timeFrame: month
    geo: global
    domains:
    - https://dev-docs.spreecommerce.org/api-reference/introduction
    unit: 1
    price: '0.00'
    userMultiplied: false
  - label: Rate Limit
    description: No provider-enforced rate limit. Operators configure their own.
    name: rate_limit
    type: rate
    metric: requests_per_minute
    limit: 0
    timeFrame: minute
    geo: global
    domains:
    - https://dev-docs.spreecommerce.org/api-reference/introduction
    unit: 1
    price: '0.00'
- id: spree-commerce-enterprise
  name: Spree Enterprise
  type: enterprise
  description: >-
    Commercial Spree Enterprise edition / Spree Cloud - hosted, supported, and
    extended Spree with SLAs, security review, and managed infrastructure.
    Pricing is custom; reconcile against the provider's published terms.
  entries:
  - label: API Requests
    description: Custom-quota tier; reconcile against the provider's Enterprise contract.
    name: api_requests
    type: quota
    metric: requests
    limit: 0
    timeFrame: month
    geo: global
    domains:
    - https://dev-docs.spreecommerce.org/api-reference/introduction
    unit: 1
    price: '0.00'
    userMultiplied: false
  - label: Rate Limit
    description: Custom rate envelope; reconcile against the provider's Enterprise contract.
    name: rate_limit
    type: rate
    metric: requests_per_minute
    limit: 0
    timeFrame: minute
    geo: global
    domains:
    - https://dev-docs.spreecommerce.org/api-reference/introduction
    unit: 1
    price: '0.00'
references:
- name: Spree Commerce Pricing
  url: https://spreecommerce.org/pricing/
- name: Spree Commerce API Documentation
  url: https://dev-docs.spreecommerce.org/api-reference/introduction
