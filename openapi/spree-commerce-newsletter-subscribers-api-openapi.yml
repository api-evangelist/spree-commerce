openapi: 3.2.0
info:
  title: Store Newsletter Subscribers API
  contact:
    name: Spree Commerce
    url: https://spreecommerce.org
    email: hello@spreecommerce.org
  description: Spree Store API v3 - Customer-facing storefront API for building headless commerce experiences.
  version: v3
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
tags:
- name: Newsletter Subscribers
  description: Guest and customer newsletter subscriptions (double opt-in)
paths:
  /api/v3/store/newsletter_subscribers:
    post:
      summary: Subscribe to the newsletter
      tags:
      - Newsletter Subscribers
      security:
      - api_key: []
      description: 'Subscribes an email address to the newsletter for the current store.


        Behavior:


        - If the email is already verified for this store, the existing subscription is returned unchanged.

        - If the request is unauthenticated (guest), the subscription is created in an unverified state

        and two events are published: `newsletter_subscriber.subscription_requested` (carrying the

        `verification_token` and the validated `redirect_url`, intended for headless storefronts that

        want to send the confirmation email themselves via a webhook handler) and the legacy

        `newsletter_subscriber.subscribed` lifecycle event (which the bundled `spree_emails` package

        listens to and uses to send a default confirmation email). The confirmation link should point

        at `redirect_url?token=` and call `POST /newsletter_subscribers/verify`

        when the user clicks it.

        - If the request is authenticated via JWT and the customer''s email matches the subscribed email,

        the subscription is auto-verified and no events are fired — the JWT already proves email

        ownership, so no confirmation email is needed.


        The optional `redirect_url` is where the verification token should land on the storefront. The

        server does not return a validation error when the URL is outside the store''s

        Allowed Origins; instead, the URL is silently

        omitted from the webhook payload (secure-by-default). When no allow-list is configured on the

        store, the URL is also omitted. Callers therefore receive the same 201 regardless, and the

        webhook handler should fall back to the store''s storefront URL when `redirect_url` is missing

        from the payload.


        Newsletter consent is preserved across registration: if a guest subscribes and later registers

        with the same email, the existing subscriber record is reused.'
      x-codeSamples:
      - lang: javascript
        label: Spree SDK
        source: "import { createClient } from '@spree/sdk'\n\nconst client = createClient({\n  baseUrl: 'https://your-store.com',\n  publishableKey: '<api-key>',\n})\n\nconst subscriber = await client.newsletterSubscribers.create({\n  email: 'subscriber@example.com',\n  // Where the verification token should land. Must be in the store's\n  // allowed origins. The storefront's webhook handler will send the\n  // confirmation email with a link to `<redirect_url>?token=<token>`.\n  redirect_url: 'https://your-store.com/newsletter/confirm',\n})"
      parameters:
      - name: x-spree-api-key
        in: header
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: false
        description: Optional Bearer JWT — when present, links the subscription to that customer
        schema:
          type: string
      responses:
        '201':
          description: auto-verified when JWT matches subscribed email
          content:
            application/json:
              example:
                id: sub_UkLWZg9DAJ
                email: eufemia@stoltenbergwalter.ca
                created_at: '2026-05-21T18:12:32.551Z'
                updated_at: '2026-05-21T18:12:32.553Z'
                verified: true
                verified_at: '2026-05-21T18:12:32Z'
                customer_id: cus_UkLWZg9DAJ
              schema:
                $ref: '#/components/schemas/NewsletterSubscriber'
        '422':
          description: invalid email format
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: Email is invalid
                  details:
                    email:
                    - is invalid
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: subscriber@example.com
                redirect_url:
                  type: string
                  format: uri
                  example: https://your-store.com/newsletter/confirm
                  description: Storefront URL the verification token should be appended to. Silently omitted from the webhook payload when the store has allowed origins configured and this URL does not match one of them, or when no allowed origins are configured at all.
              required:
              - email
      operationId: postApiV3StoreNewsletterSubscribers
      x-operation-id-source: derived
  /api/v3/store/newsletter_subscribers/verify:
    post:
      summary: Verify a newsletter subscription
      tags:
      - Newsletter Subscribers
      security:
      - api_key: []
      description: 'Confirms a pending newsletter subscription using the verification token sent by email.


        After successful verification:

        - The subscriber record is marked verified.

        - If the subscription is associated with a customer, that customer''s `accepts_email_marketing`

        flag is set to `true`.'
      x-codeSamples:
      - lang: javascript
        label: Spree SDK
        source: "import { createClient } from '@spree/sdk'\n\nconst client = createClient({\n  baseUrl: 'https://your-store.com',\n  publishableKey: '<api-key>',\n})\n\nconst subscriber = await client.newsletterSubscribers.verify({\n  token: 'abc123def456',\n})"
      parameters:
      - name: x-spree-api-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: subscription verified
          content:
            application/json:
              example:
                id: sub_UkLWZg9DAJ
                email: pending@example.com
                created_at: '2026-05-21T18:12:32.578Z'
                updated_at: '2026-05-21T18:12:32.591Z'
                verified: true
                verified_at: '2026-05-21T18:12:32Z'
                customer_id: null
              schema:
                $ref: '#/components/schemas/NewsletterSubscriber'
        '422':
          description: missing token
          content:
            application/json:
              example:
                error:
                  code: parameter_missing
                  message: token is required
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  example: abc123def456
                  description: Verification token from the confirmation email
              required:
              - token
      operationId: postApiV3StoreNewsletterSubscribersVerify
      x-operation-id-source: derived
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: record_not_found
            message:
              type: string
              example: Record not found
            details:
              type:
              - object
              - 'null'
              description: Field-specific validation errors
              example:
                name:
                - is too short
                - is required
                email:
                - is invalid
          required:
          - code
          - message
      required:
      - error
      example:
        error:
          code: validation_error
          message: Validation failed
          details:
            name:
            - is too short
            email:
            - is invalid
    NewsletterSubscriber:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        verified:
          type: boolean
        verified_at:
          type:
          - string
          - 'null'
        customer_id:
          type:
          - string
          - 'null'
      required:
      - id
      - email
      - created_at
      - updated_at
      - verified
      - verified_at
      - customer_id
      x-typelizer: true
  securitySchemes:
    api_key:
      type: apiKey
      name: x-spree-api-key
      in: header
      description: Publishable API key for store access
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authenticated customers
x-tagGroups:
- name: Authentication
  tags:
  - Authentication
- name: Product Catalog
  tags:
  - Product Catalog
- name: Carts
  tags:
  - Carts
- name: Orders
  tags:
  - Orders
- name: Customers
  tags:
  - Customers
- name: Markets
  tags:
  - Markets
- name: Wishlists
  tags:
  - Wishlists
- name: Newsletter Subscribers
  tags:
  - Newsletter Subscribers
- name: Policies
  tags:
  - Policies
- name: Digitals
  tags:
  - Digitals
