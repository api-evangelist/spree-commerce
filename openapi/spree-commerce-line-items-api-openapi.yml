components:
  schemas:
    resource_properties:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
        relationships:
          type: object
      required:
      - id
      - type
      - attributes
      x-internal: false
    create_line_item_params:
      type: object
      properties:
        line_item:
          type: object
          required:
          - order_id
          - variant_id
          - quantity
          properties:
            order_id:
              type: string
              example: '1'
            variant_id:
              type: string
              example: '1'
            quantity:
              type: integer
              example: 2
            public_metadata:
              type: object
            private_metadata:
              type: object
      required:
      - line_item
      x-internal: false
    resources_list:
      type: object
      properties:
        data:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/resource_properties'
        meta:
          type: object
          properties:
            count:
              type: integer
            total_count:
              type: integer
            total_pages:
              type: integer
          required:
          - count
          - total_count
          - total_pages
        links:
          type: object
          properties:
            self:
              type: string
            next:
              type: string
            prev:
              type: string
            last:
              type: string
            first:
              type: string
          required:
          - self
          - next
          - prev
          - last
          - first
      required:
      - data
      - meta
      - links
      x-internal: false
    validation_errors:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
      required:
      - error
      - errors
      x-internal: false
    resource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/resource_properties'
      required:
      - data
      x-internal: false
    error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      x-internal: false
    update_line_item_params:
      type: object
      properties:
        line_item:
          type: object
          properties:
            variant_id:
              type: string
              example: '1'
            quantity:
              type: integer
              example: 2
      required:
      - line_item
      x-internal: false
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
