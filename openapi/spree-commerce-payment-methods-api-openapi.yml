components:
  schemas:
    resource_properties:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
        relationships:
          type: object
      required:
      - id
      - type
      - attributes
      x-internal: false
    create_payment_method_params:
      type: object
      properties:
        payment_method:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              example: Test Payment Method
            active:
              type: boolean
            auto_capture:
              type: boolean
            description:
              type: string
              example: This is a test payment method
            type:
              type: string
              example: Spree::Gateway::Bogus
              enum:
              - Spree::Gateway::Bogus
              - Spree::PaymentMethod::Check
            display_on:
              type: string
              example: both
              enum:
              - both
              - back_end
              - front_end
            store_ids:
              type: array
              items:
                allOf:
                - type: string
                  example: '2'
            public_metadata:
              type: object
            private_metadata:
              type: object
      required:
      - payment_method
      x-internal: false
    update_payment_method_params:
      type: object
      properties:
        payment_method:
          type: object
          properties:
            name:
              type: string
              example: Test Payment Method
            active:
              type: boolean
            auto_capture:
              type: boolean
            description:
              type: string
              example: This is a test payment method
            type:
              type: string
              example: Spree::Gateway::Bogus
              enum:
              - Spree::Gateway::Bogus
              - Spree::PaymentMethod::Check
            display_on:
              type: string
              example: both
              enum:
              - both
              - back_end
              - front_end
            store_ids:
              type: array
              items:
                allOf:
                - type: string
                  example: '2'
            public_metadata:
              type: object
            private_metadata:
              type: object
      required:
      - payment_method
      x-internal: false
      title: Update Payment Method
    resources_list:
      type: object
      properties:
        data:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/resource_properties'
        meta:
          type: object
          properties:
            count:
              type: integer
            total_count:
              type: integer
            total_pages:
              type: integer
          required:
          - count
          - total_count
          - total_pages
        links:
          type: object
          properties:
            self:
              type: string
            next:
              type: string
            prev:
              type: string
            last:
              type: string
            first:
              type: string
          required:
          - self
          - next
          - prev
          - last
          - first
      required:
      - data
      - meta
      - links
      x-internal: false
    validation_errors:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
      required:
      - error
      - errors
      x-internal: false
    resource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/resource_properties'
      required:
      - data
      x-internal: false
    error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      x-internal: false
    update_payment_method_params_bogus_gateway:
      type: object
      properties:
        payment_method:
          type: object
          properties:
            preferred_dummy_key:
              type: string
              example: UPDATED-DUMMY-KEY-123
            preferred_server:
              type: string
              example: production
            preferred_test_mode:
              type: boolean
      required:
      - payment_method
      x-internal: false
      title: Update Bogus Gateway
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
