                        created_at: '2022-11-08T19:34:48.527Z'
                        updated_at: '2022-11-08T19:34:48.530Z'
                        deleted_at: null
                        public_metadata: {}
                        private_metadata: {}
                        preferences:
                          dummy_key: PUBLICKEY123
                          test_mode: true
                          server: test
                      relationships:
                        stores:
                          data:
                          - id: '291'
                            type: store
                          - id: '292'
                            type: store
              schema:
                $ref: '#/components/schemas/resource'
        '422':
          description: Invalid request
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: Name can't be blank
                    errors:
                      name:
                      - can't be blank
              schema:
                $ref: '#/components/schemas/validation_errors'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_payment_method_params'
  /api/v2/platform/payment_methods/{id}:
    get:
      summary: Return a Payment Method
      tags:
      - Payment Methods
      security:
      - bearer_auth: []
      description: Returns a Payment Method
      operationId: show-payment-method
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: include
        in: query
        description: 'Select which associated resources you would like to fetch, see: <a href="https://jsonapi.org/format/#fetching-includes">https://jsonapi.org/format/#fetching-includes</a>'
        example: stores
        schema:
          type: string
      responses:
        '200':
          description: Record found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                      id: '30'
                      type: payment_method
                      attributes:
                        name: Credit Card
                        type: Spree::Gateway::Bogus
                        description: null
                        active: true
                        display_on: both
                        auto_capture: null
                        position: 4
                        created_at: '2022-11-08T19:34:48.855Z'
                        updated_at: '2022-11-08T19:34:48.857Z'
                        deleted_at: null
                        public_metadata: {}
                        private_metadata: {}
                        preferences:
                          dummy_key: PUBLICKEY123
                          test_mode: true
                          server: test
                      relationships:
                        stores:
                          data:
                          - id: '295'
                            type: store
              schema:
                $ref: '#/components/schemas/resource'
        '404':
          description: Record not found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The resource you were looking for could not be found.
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
    patch:
      summary: Update a Payment Method
      tags:
      - Payment Methods
      security:
      - bearer_auth: []
      description: Updates a Payment Method
      operationId: update-payment-method
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: include
        in: query
        description: 'Select which associated resources you would like to fetch, see: <a href="https://jsonapi.org/format/#fetching-includes">https://jsonapi.org/format/#fetching-includes</a>'
        example: stores
        schema:
          type: string
      responses:
        '200':
          description: Record updated
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                      id: '40'
                      type: payment_method
                      attributes:
                        name: Credit Card
                        type: Spree::Gateway::Bogus
                        description: null
                        active: true
