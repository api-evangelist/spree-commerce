                        backorderable: true
                        available: true
                        currency: USD
                        price: '19.99'
                        compare_at_price: null
                      relationships:
                        product:
                          data:
                            id: '216'
                            type: product
                        tax_category:
                          data: null
                        digitals:
                          data: []
                        images:
                          data: []
                        option_values:
