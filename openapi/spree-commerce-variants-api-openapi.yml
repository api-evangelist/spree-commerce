openapi: 3.2.0
info:
  title: Spree Commerce Variants API
  version: '1.0'
  description: 'Operations tagged Variants across 2 of this provider''s published API definitions: spree-commerce-platform-api-openapi.yml, spree-commerce-storefront-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
- url: https://demo.spreecommerce.org
  description: demo
- url: http://localhost:3000
  description: localhost
tags:
- name: Variants
