  /api/v2/platform/variants/{id}:
    get:
      summary: Return a Variant
      tags:
      - Variants
      security:
      - bearer_auth: []
      description: Returns a Variant
      operationId: show-variant
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: include
        in: query
        description: 'Select which associated resources you would like to fetch, see: <a href="https://jsonapi.org/format/#fetching-includes">https://jsonapi.org/format/#fetching-includes</a>'
        example: product,tax_category,images,digitals
        schema:
          type: string
      responses:
        '200':
          description: Record found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                      id: '291'
                      type: variant
                      attributes:
                        sku: SKU-290
                        weight: '185.0'
                        height: '33.55'
                        depth: '3.78'
                        deleted_at: null
                        is_master: false
                        cost_price: '17.0'
                        position: 2
                        cost_currency: USD
                        track_inventory: true
                        updated_at: '2022-11-08T19:35:57.221Z'
