openapi: 3.2.0
info:
  title: Platform Shipping Categories API
  contact:
    name: Vendo Connect Inc.
    url: https://getvendo.com
    email: sales@getvendo.com
  description: Spree Platform API
  version: v2
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
tags:
- name: Shipping Categories
paths:
  /api/v2/platform/shipping_categories:
    get:
      summary: Return a list of Shipping Categories
      tags:
      - Shipping Categories
      security:
      - bearer_auth: []
      description: Returns a list of Shipping Categories
      operationId: shipping-categories-list
      parameters:
      - name: page
        in: query
        example: 1
        schema:
          type: integer
      - name: per_page
        in: query
        example: 50
        schema:
          type: integer
      - name: filter[name_i_cont]
        in: query
        description: ''
        example: default
        schema:
          type: string
      responses:
        '200':
          description: Records returned
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                    - id: '134'
                      type: shipping_category
                      attributes:
                        name: ShippingCategory 134
                        created_at: '2022-11-08T19:35:21.335Z'
                        updated_at: '2022-11-08T19:35:21.335Z'
                    - id: '135'
                      type: shipping_category
                      attributes:
                        name: ShippingCategory 135
                        created_at: '2022-11-08T19:35:21.336Z'
                        updated_at: '2022-11-08T19:35:21.336Z'
                    meta:
                      count: 2
                      total_count: 2
                      total_pages: 1
                    links:
                      self: http://www.example.com/api/v2/platform/shipping_categories?page=1&per_page=&filter[name_i_cont]=
                      next: http://www.example.com/api/v2/platform/shipping_categories?filter%5Bname_i_cont%5D=&page=1&per_page=
                      prev: http://www.example.com/api/v2/platform/shipping_categories?filter%5Bname_i_cont%5D=&page=1&per_page=
                      last: http://www.example.com/api/v2/platform/shipping_categories?filter%5Bname_i_cont%5D=&page=1&per_page=
                      first: http://www.example.com/api/v2/platform/shipping_categories?filter%5Bname_i_cont%5D=&page=1&per_page=
              schema:
                $ref: '#/components/schemas/resources_list'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
    post:
      summary: Create a Shipping Category
      tags:
      - Shipping Categories
      security:
      - bearer_auth: []
      description: Creates a Shipping Category
      operationId: create-shipping-category
      parameters: []
      responses:
        '201':
          description: Record created
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                      id: '138'
                      type: shipping_category
                      attributes:
                        name: ShippingCategory 138
                        created_at: '2022-11-08T19:35:21.863Z'
                        updated_at: '2022-11-08T19:35:21.863Z'
              schema:
                $ref: '#/components/schemas/resource'
        '422':
          description: Invalid request
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: Name can't be blank
                    errors:
                      name:
                      - can't be blank
              schema:
                $ref: '#/components/schemas/validation_errors'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_shipping_category_params'
  /api/v2/platform/shipping_categories/{id}:
    get:
      summary: Return a Shipping Category
      tags:
      - Shipping Categories
      security:
      - bearer_auth: []
      description: Returns a Shipping Category
      operationId: show-shipping-category
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Record found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                      id: '139'
                      type: shipping_category
                      attributes:
                        name: ShippingCategory 139
                        created_at: '2022-11-08T19:35:22.131Z'
                        updated_at: '2022-11-08T19:35:22.131Z'
              schema:
                $ref: '#/components/schemas/resource'
        '404':
          description: Record not found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The resource you were looking for could not be found.
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
    patch:
      summary: Update a Shipping Category
      tags:
      - Shipping Categories
      security:
      - bearer_auth: []
      description: Updates a Shipping Category
      operationId: update-shipping-category
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Record updated
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                      id: '141'
                      type: shipping_category
                      attributes:
                        name: Default
                        created_at: '2022-11-08T19:35:22.647Z'
                        updated_at: '2022-11-08T19:35:22.876Z'
              schema:
                $ref: '#/components/schemas/resource'
        '422':
          description: Invalid request
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: Name can't be blank
                    errors:
                      name:
                      - can't be blank
              schema:
                $ref: '#/components/schemas/validation_errors'
        '404':
          description: Record not found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The resource you were looking for could not be found.
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_shipping_category_params'
    delete:
      summary: Delete a Shipping Category
      tags:
      - Shipping Categories
      security:
      - bearer_auth: []
      description: Deletes a Shipping Category
      operationId: delete-shipping-category
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Record deleted
        '404':
          description: Record not found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The resource you were looking for could not be found.
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
components:
  schemas:
    create_shipping_category_params:
      type: object
      properties:
        shipping_category:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              example: Another Category
      required:
      - shipping_category
      x-internal: false
    resource_properties:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
        relationships:
          type: object
      required:
      - id
      - type
      - attributes
      x-internal: false
    update_shipping_category_params:
      type: object
      properties:
        shipping_category:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              example: Another Category
      required:
      - shipping_category
      x-internal: false
    resources_list:
      type: object
      properties:
        data:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/resource_properties'
        meta:
          type: object
          properties:
            count:
              type: integer
            total_count:
              type: integer
            total_pages:
              type: integer
          required:
          - count
          - total_count
          - total_pages
        links:
          type: object
          properties:
            self:
              type: string
            next:
              type: string
            prev:
              type: string
            last:
              type: string
            first:
              type: string
          required:
          - self
          - next
          - prev
          - last
          - first
      required:
      - data
      - meta
      - links
      x-internal: false
    validation_errors:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
      required:
      - error
      - errors
      x-internal: false
    resource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/resource_properties'
      required:
      - data
      x-internal: false
    error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      x-internal: false
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
