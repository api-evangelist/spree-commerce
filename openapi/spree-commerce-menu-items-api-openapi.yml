components:
  schemas:
    menu_item_reposition:
      type: object
      properties:
        menu_item:
          type: object
          required:
          - new_parent_id
          - new_position_idx
          properties:
            new_parent_id:
              type: integer
              example: 1
              description: The ID of the new target parent Menu Item.
            new_position_idx:
              type: integer
              example: 1
              description: The new index position of the Menu Item within its parent
      required:
      - menu_item
      title: Reposition a Menu Item
      x-internal: false
    resource_properties:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
        relationships:
          type: object
      required:
      - id
      - type
      - attributes
      x-internal: false
    resources_list:
      type: object
      properties:
        data:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/resource_properties'
        meta:
          type: object
          properties:
            count:
              type: integer
            total_count:
              type: integer
            total_pages:
              type: integer
          required:
          - count
          - total_count
          - total_pages
        links:
          type: object
          properties:
            self:
              type: string
            next:
              type: string
            prev:
              type: string
            last:
              type: string
            first:
              type: string
          required:
          - self
          - next
          - prev
          - last
          - first
      required:
      - data
      - meta
      - links
      x-internal: false
    update_menu_item_params:
      type: object
      properties:
        menu_item:
          type: object
          properties:
            name:
              type: string
              example: T-Shirts
              description: Update the name of this Menu Item
            code:
              type:
              - string
              - 'null'
              example: MEN-TS
              description: The Menu Item a code to identifies this Menu Item from others. This is especially useful when using Container type Menu Items to group items.
            subtitle:
              type:
              - string
              - 'null'
              example: Shop men's T-Shirts
              description: Set an optional subtitle for the Menu Item, this is useful if your menu has promotional links that require more than just a link name.
            destination:
              type:
              - string
              - 'null'
              example: https://getvendo.com
              description: 'Used when the linked_resource_type is set to: URL'
            menu_id:
              type: integer
              example: 1
              description: Specify the ID of the Menu this item belongs to.
            new_window:
              type: boolean
              description: When set to `true` the link will be opened in a new tab or window.
            item_type:
              type: string
              enum:
              - Link
              - Container
              description: Links are standard links, where as Containers are used to group links.
            linked_resource_type:
              type: string
              enum:
              - URL
              - Spree::Taxon
              - Spree::Product
              - Spree::CmsPage
              description: 'Change the type of resource you want to link to, or set to: URL to use the destination field for an external link.'
            linked_resource_id:
              type:
              - integer
              - 'null'
              example: 1
              description: The ID of the resource you are linking to.
      required:
      - menu_item
      title: Update a Menu Item
      x-internal: false
    validation_errors:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
      required:
      - error
      - errors
      x-internal: false
    create_menu_item_params:
      type: object
      properties:
        menu_item:
          type: object
          required:
          - name
          - menu_id
          properties:
            name:
              type: string
              example: T-Shirts
              description: The name of this Menu Item
            code:
              type:
              - string
              - 'null'
              example: MEN-TS
              description: Give this Menu Item a code to identify this Menu Item from others. This is especially useful when using Container type Menu Items to group items.
            subtitle:
              type:
              - string
              - 'null'
              example: Shop men's T-Shirts
              description: Set an optional subtitle for the Menu Item, this is useful if your menu has promotional links that require more than just a link name.
            destination:
              type:
              - string
              - 'null'
              example: https://getvendo.com
              description: 'Used when the linked_resource_type is set to: URL'
            menu_id:
              type: integer
              example: 1
              description: Specify the ID of the Menu this item belongs to.
            new_window:
              type: boolean
              description: When set to `true` the link will be opened in a new tab or window.
            item_type:
              type: string
              enum:
              - Link
              - Container
              description: Links are standard links, where as Containers are used to group links.
            linked_resource_type:
              type: string
              enum:
              - URL
