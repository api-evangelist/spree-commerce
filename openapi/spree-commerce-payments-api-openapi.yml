openapi: 3.2.0
info:
  title: Platform Payments API
  contact:
    name: Vendo Connect Inc.
    url: https://getvendo.com
    email: sales@getvendo.com
  description: Spree Platform API
  version: v2
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
tags:
- name: Payments
paths:
  /api/v2/platform/payments:
    get:
      summary: Return a list of Payments
      tags:
      - Payments
      security:
      - bearer_auth: []
      description: Returns a list of Payments
      operationId: payments-list
      parameters:
      - name: page
        in: query
        example: 1
        schema:
          type: integer
      - name: per_page
        in: query
        example: 50
        schema:
          type: integer
      - name: include
        in: query
        description: 'Select which associated resources you would like to fetch, see: <a href="https://jsonapi.org/format/#fetching-includes">https://jsonapi.org/format/#fetching-includes</a>'
        example: payment_method,order,source
        schema:
          type: string
      - name: filter[payment_method_id_eq]
        in: query
        description: ''
        example: '1'
        schema:
          type: string
      - name: filter[amount_gteq]
        in: query
        description: ''
        example: '99.90'
        schema:
          type: string
      responses:
        '200':
          description: Records returned
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                    - id: '6'
                      type: payment
                      attributes:
                        amount: '45.75'
                        source_type: Spree::CreditCard
                        state: invalid
                        response_code: '12345'
                        avs_response: null
                        created_at: '2022-11-08T19:34:50.932Z'
                        updated_at: '2022-11-08T19:34:50.951Z'
                        number: PPC5V5ZL
                        cvv_response_code: null
                        cvv_response_message: null
                        public_metadata: {}
                        private_metadata: {}
                        display_amount: $45.75
                      relationships:
                        order:
                          data:
                            id: '72'
                            type: order
                        payment_method:
                          data:
                            id: '60'
                            type: payment_method
                        source:
                          data:
                            id: '5'
                            type: credit_card
                        log_entries:
                          data: []
                        state_changes:
                          data:
                          - id: '15'
                            type: state_change
                        payment_capture_events:
                          data: []
                        refunds:
                          data: []
                    - id: '7'
                      type: payment
                      attributes:
                        amount: '45.75'
                        source_type: Spree::CreditCard
                        state: checkout
                        response_code: '12345'
                        avs_response: null
                        created_at: '2022-11-08T19:34:50.949Z'
                        updated_at: '2022-11-08T19:34:50.949Z'
                        number: PB59CC7E
                        cvv_response_code: null
                        cvv_response_message: null
                        public_metadata: {}
                        private_metadata: {}
                        display_amount: $45.75
                      relationships:
                        order:
                          data:
                            id: '72'
                            type: order
                        payment_method:
                          data:
                            id: '60'
                            type: payment_method
                        source:
                          data:
                            id: '6'
                            type: credit_card
                        log_entries:
                          data: []
                        state_changes:
                          data: []
                        payment_capture_events:
                          data: []
                        refunds:
                          data: []
                    meta:
                      count: 2
                      total_count: 2
                      total_pages: 1
                    links:
                      self: http://www.example.com/api/v2/platform/payments?page=1&per_page=&include=&filter[payment_method_id_eq]=&filter[amount_gteq]=
                      next: http://www.example.com/api/v2/platform/payments?filter%5Bamount_gteq%5D=&filter%5Bpayment_method_id_eq%5D=&include=&page=1&per_page=
                      prev: http://www.example.com/api/v2/platform/payments?filter%5Bamount_gteq%5D=&filter%5Bpayment_method_id_eq%5D=&include=&page=1&per_page=
                      last: http://www.example.com/api/v2/platform/payments?filter%5Bamount_gteq%5D=&filter%5Bpayment_method_id_eq%5D=&include=&page=1&per_page=
                      first: http://www.example.com/api/v2/platform/payments?filter%5Bamount_gteq%5D=&filter%5Bpayment_method_id_eq%5D=&include=&page=1&per_page=
              schema:
                $ref: '#/components/schemas/resources_list'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
  /api/v2/platform/payments/{id}:
    get:
      summary: Return a Payment
      tags:
      - Payments
      security:
      - bearer_auth: []
      description: Returns a Payment
      operationId: show-payment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: include
        in: query
        description: 'Select which associated resources you would like to fetch, see: <a href="https://jsonapi.org/format/#fetching-includes">https://jsonapi.org/format/#fetching-includes</a>'
        example: payment_method,order,source
        schema:
          type: string
      responses:
        '200':
          description: Record found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                      id: '10'
                      type: payment
                      attributes:
                        amount: '45.75'
                        source_type: Spree::CreditCard
                        state: checkout
                        response_code: '12345'
                        avs_response: null
                        created_at: '2022-11-08T19:34:51.349Z'
                        updated_at: '2022-11-08T19:34:51.349Z'
                        number: PROYB91V
                        cvv_response_code: null
                        cvv_response_message: null
                        public_metadata: {}
                        private_metadata: {}
                        display_amount: $45.75
                      relationships:
                        order:
                          data:
                            id: '74'
                            type: order
                        payment_method:
                          data:
                            id: '66'
                            type: payment_method
                        source:
                          data:
                            id: '9'
                            type: credit_card
                        log_entries:
                          data: []
                        state_changes:
                          data: []
                        payment_capture_events:
                          data: []
                        refunds:
                          data: []
              schema:
                $ref: '#/components/schemas/resource'
        '404':
          description: Record not found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The resource you were looking for could not be found.
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
    delete:
      summary: Delete a Payment
      tags:
      - Payments
      security:
      - bearer_auth: []
      description: Deletes a Payment
      operationId: delete-payment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Record deleted
        '404':
          description: Record not found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The resource you were looking for could not be found.
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
components:
  schemas:
    resource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/resource_properties'
      required:
      - data
      x-internal: false
    resource_properties:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
        relationships:
          type: object
      required:
      - id
      - type
      - attributes
      x-internal: false
    error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      x-internal: false
    resources_list:
      type: object
      properties:
        data:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/resource_properties'
        meta:
          type: object
          properties:
            count:
              type: integer
            total_count:
              type: integer
            total_pages:
              type: integer
          required:
          - count
          - total_count
          - total_pages
        links:
          type: object
          properties:
            self:
              type: string
            next:
              type: string
            prev:
              type: string
            last:
              type: string
            first:
              type: string
          required:
          - self
          - next
          - prev
          - last
          - first
      required:
      - data
      - meta
      - links
      x-internal: false
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
