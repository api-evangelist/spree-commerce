openapi: 3.2.0
info:
  title: Platform Data Feeds API
  contact:
    name: Vendo Connect Inc.
    url: https://getvendo.com
    email: sales@getvendo.com
  description: Spree Platform API
  version: v2
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
tags:
- name: Data Feeds
paths:
  /api/v2/platform/data_feeds:
    get:
      summary: Return a list of Data Feeds
      tags:
      - Data Feeds
      security:
      - bearer_auth: []
      operationId: data-feeds-list
      parameters:
      - name: page
        in: query
        example: 1
        schema:
          type: integer
      - name: per_page
        in: query
        example: 50
        schema:
          type: integer
      responses:
        '200':
          description: Records returned
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                    - id: '1'
                      type: data_feed
                      attributes:
                        name: First Data Feed
                        type: Spree::DataFeed::Google
                        slug: e593ae1f-630a-4f77-832f-0489da1c921b
                        active: true
                    - id: '2'
                      type: data_feed
                      attributes:
                        name: Second Data Feed
                        type: Spree::DataFeed::Google
                        slug: 52f060f2-76cf-4983-89a3-714419941463
                        active: true
                    meta:
                      count: 2
                      total_count: 2
                      total_pages: 1
                    links:
                      self: http://www.example.com/api/v2/platform/data_feeds?page=1&per_page=
                      next: http://www.example.com/api/v2/platform/data_feeds?page=1&per_page=
                      prev: http://www.example.com/api/v2/platform/data_feeds?page=1&per_page=
                      last: http://www.example.com/api/v2/platform/data_feeds?page=1&per_page=
                      first: http://www.example.com/api/v2/platform/data_feeds?page=1&per_page=
              schema:
                $ref: '#/components/schemas/resources_list'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
    post:
      summary: Create a Data Feed
      tags:
      - Data Feeds
      security:
      - bearer_auth: []
      description: Creates a Data Feed
      operationId: create-data-feed
      parameters: []
      responses:
        '201':
          description: Record created
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                      id: '1'
                      type: data_feed
                      attributes:
                        name: First Data Feed
                        type: Spree::DataFeed::Google
                        slug: e593ae1f-630a-4f77-832f-0489da1c921b
                        active: true
              schema:
                $ref: '#/components/schemas/resource'
        '422':
          description: Invalid request
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: Data Feed name can't be blank
                    errors:
                      name:
                      - can't be blank
                      type:
                      - can't be blank
              schema:
                $ref: '#/components/schemas/validation_errors'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_data_feed_params'
  /api/v2/platform/data_feeds/{id}:
    get:
      summary: Return a Data Feed
      tags:
      - Data Feeds
      security:
      - bearer_auth: []
      description: Returns a Data Feed
      operationId: show-data-feed
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Record found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                      id: '1'
                      type: data_feed
                      attributes:
                        name: First Data Feed
                        type: Spree::DataFeed::Google
                        slug: e593ae1f-630a-4f77-832f-0489da1c921b
                        active: true
                      relationships:
                        store:
                          data:
                            id: '1'
                            type: store
              schema:
                $ref: '#/components/schemas/resource'
        '404':
          description: Record not found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The resource you were looking for could not be found.
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
    patch:
      summary: Update a Data Feed
      tags:
      - Data Feeds
      security:
      - bearer_auth: []
      description: Updates a Data Feed
      operationId: update-data-feed
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Record updated
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                      id: '1'
                      type: data_feed
                      attributes:
                        name: First Data Feed
                        type: Spree::DataFeed::Google
                        slug: e593ae1f-630a-4f77-832f-0489da1c921b
                        active: true
              schema:
                $ref: '#/components/schemas/resource'
        '422':
          description: Invalid request
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: Name is blank
                    errors:
                      name:
                      - is blank
              schema:
                $ref: '#/components/schemas/validation_errors'
        '404':
          description: Record not found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The resource you were looking for could not be found.
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_data_feed_params'
    delete:
      summary: Delete a Data Feed
      tags:
      - Data Feeds
      security:
      - bearer_auth: []
      description: Deletes a Data Feed
      operationId: delete-data-feed
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Record deleted
        '404':
          description: Record not found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The resource you were looking for could not be found.
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
components:
  schemas:
    create_data_feed_params:
      type: object
      properties:
        data_feed:
          type: object
          required:
          - name
          - type
          properties:
            name:
              type: string
              example: First data feed
            slug:
              type: string
              example: first-data-feed
            type:
              type: string
              example: Spree::DataFeed::Google
            active:
              type: boolean
      x-internal: false
    resource_properties:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
        relationships:
          type: object
      required:
      - id
      - type
      - attributes
      x-internal: false
    update_data_feed_params:
      type: object
      properties:
        data_feed:
          type: object
          required:
          - name
          - type
          properties:
            name:
              type: string
              example: First data feed
            slug:
              type: string
              example: first-data-feed
            type:
              type: string
              example: Spree::DataFeed::Google
            active:
              type: boolean
      x-internal: false
    resources_list:
      type: object
      properties:
        data:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/resource_properties'
        meta:
          type: object
          properties:
            count:
              type: integer
            total_count:
              type: integer
            total_pages:
              type: integer
          required:
          - count
          - total_count
          - total_pages
        links:
          type: object
          properties:
            self:
              type: string
            next:
              type: string
            prev:
              type: string
            last:
              type: string
            first:
              type: string
          required:
          - self
          - next
          - prev
          - last
          - first
      required:
      - data
      - meta
      - links
      x-internal: false
    validation_errors:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
      required:
      - error
      - errors
      x-internal: false
    resource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/resource_properties'
      required:
      - data
      x-internal: false
    error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      x-internal: false
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
