      operationId: delete-store-credit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Record deleted
        '404':
          description: Record not found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The resource you were looking for could not be found.
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
components:
  schemas:
    validation_errors:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
      required:
      - error
      - errors
      x-internal: false
    resource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/resource_properties'
      required:
      - data
      x-internal: false
    resource_properties:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
        relationships:
          type: object
      required:
      - id
      - type
      - attributes
      x-internal: false
    update_store_credit_params:
      type: object
      properties:
        store_credit:
          type: object
          required:
          - user_id
          - category_id
          - type_id
          - created_by_id
          - currency
          - store_id
          - amount
          properties:
            user_id:
              type: string
              example: '2'
            category_id:
              type: string
              example: '4'
            created_by_id:
              type: string
              example: '5'
            amount:
              type: number
              example: 25.0
            amount_used:
              type: number
              example: 10.0
            memo:
              type: string
              example: This credit was given as a refund
            currency:
              type: string
              example: USD
            amount_authorized:
              type: number
              example: 15.5
            originator_id:
              type: string
              example: '3'
            originator_type:
              type: string
              example: Refund
            type_id:
              type: string
              example: '1'
            store_id:
              type: string
              example: '2'
            public_metadata:
              type: object
            private_metadata:
              type: object
      required:
      - store_credit
      x-internal: false
    create_store_credit_params:
      type: object
      properties:
        store_credit:
          type: object
          required:
          - user_id
          - category_id
          - type_id
          - created_by_id
          - currency
          - store_id
          - amount
          properties:
            user_id:
              type: string
              example: '2'
            category_id:
              type: string
              example: '4'
            created_by_id:
              type: string
              example: '5'
            amount:
              type: number
              example: 25.0
            amount_used:
              type: number
              example: 10.0
            memo:
              type: string
              example: This credit was given as a refund
            currency:
              type: string
              example: USD
            amount_authorized:
              type: number
              example: 15.5
            originator_id:
              type: string
              example: '3'
            originator_type:
              type: string
              example: Refund
            type_id:
              type: string
              example: '1'
            store_id:
              type: string
              example: '2'
            public_metadata:
              type: object
            private_metadata:
              type: object
      required:
      - store_credit
      x-internal: false
    resources_list:
      type: object
      properties:
        data:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/resource_properties'
        meta:
          type: object
          properties:
            count:
              type: integer
            total_count:
              type: integer
            total_pages:
              type: integer
          required:
          - count
          - total_count
          - total_pages
        links:
          type: object
          properties:
            self:
              type: string
            next:
              type: string
            prev:
              type: string
            last:
              type: string
            first:
              type: string
          required:
          - self
          - next
          - prev
          - last
          - first
      required:
      - data
      - meta
      - links
      x-internal: false
    error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      x-internal: false
  securitySchemes:
    api_key:
      type: apiKey
      name: x-spree-api-key
      in: header
      description: Secret API key for admin access
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for admin user authentication
x-tagGroups:
- name: Authentication
  tags:
  - Authentication
- name: Product Catalog
  tags:
  - Product Catalog
- name: Orders
  tags:
  - Orders
- name: Customers
  tags:
  - Customers
- name: Configuration
  tags:
  - Configuration
