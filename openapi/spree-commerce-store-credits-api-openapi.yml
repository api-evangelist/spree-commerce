        '422':
          description: Invalid request
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: Amount must be greater than 0, Amount used Cannot be greater than amount., and Amount authorized Exceeds total credits.
                    errors:
                      amount:
                      - must be greater than 0
                      amount_used:
                      - Cannot be greater than amount.
