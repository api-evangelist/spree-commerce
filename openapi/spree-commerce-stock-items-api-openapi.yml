openapi: 3.2.0
info:
  title: Platform Stock Items API
  contact:
    name: Vendo Connect Inc.
    url: https://getvendo.com
    email: sales@getvendo.com
  description: Spree Platform API
  version: v2
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
tags:
- name: Stock Items
paths:
  /api/v2/platform/stock_items:
    get:
      summary: Return a list of Stock Items
      tags:
      - Stock Items
      security:
      - bearer_auth: []
      description: Returns a list of Stock Items
      operationId: stock-items-list
      parameters:
      - name: page
        in: query
        example: 1
        schema:
          type: integer
      - name: per_page
        in: query
        example: 50
        schema:
          type: integer
      - name: include
        in: query
        description: 'Select which associated resources you would like to fetch, see: <a href="https://jsonapi.org/format/#fetching-includes">https://jsonapi.org/format/#fetching-includes</a>'
        example: stock_location,variant
        schema:
          type: string
      responses:
        '200':
          description: Records returned
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                    - id: '276'
                      type: stock_item
                      attributes:
                        count_on_hand: 0
                        created_at: '2022-11-08T19:35:27.570Z'
                        updated_at: '2022-11-08T19:35:27.614Z'
                        backorderable: false
                        deleted_at: null
                        public_metadata: {}
                        private_metadata: {}
                        is_available: false
                      relationships:
                        stock_location:
                          data:
                            id: '157'
                            type: stock_location
                        variant:
                          data:
                            id: '271'
                            type: variant
                    - id: '278'
                      type: stock_item
                      attributes:
                        count_on_hand: 10
                        created_at: '2022-11-08T19:35:27.634Z'
                        updated_at: '2022-11-08T19:35:27.644Z'
                        backorderable: true
                        deleted_at: null
                        public_metadata: {}
                        private_metadata: {}
                        is_available: true
                      relationships:
                        stock_location:
                          data:
                            id: '157'
                            type: stock_location
                        variant:
                          data:
                            id: '272'
                            type: variant
                    meta:
                      count: 2
                      total_count: 2
                      total_pages: 1
                    links:
                      self: http://www.example.com/api/v2/platform/stock_items?page=1&per_page=&include=
                      next: http://www.example.com/api/v2/platform/stock_items?include=&page=1&per_page=
                      prev: http://www.example.com/api/v2/platform/stock_items?include=&page=1&per_page=
                      last: http://www.example.com/api/v2/platform/stock_items?include=&page=1&per_page=
                      first: http://www.example.com/api/v2/platform/stock_items?include=&page=1&per_page=
              schema:
                $ref: '#/components/schemas/resources_list'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
    post:
      summary: Create a Stock Item
      tags:
      - Stock Items
      security:
      - bearer_auth: []
      description: Creates a Stock Item
      operationId: create-stock-item
      parameters:
      - name: include
        in: query
        description: 'Select which associated resources you would like to fetch, see: <a href="https://jsonapi.org/format/#fetching-includes">https://jsonapi.org/format/#fetching-includes</a>'
        example: stock_location,variant
        schema:
          type: string
      responses:
        '201':
          description: Record created
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                      id: '285'
                      type: stock_item
                      attributes:
                        count_on_hand: 0
                        created_at: '2022-11-08T19:35:28.366Z'
                        updated_at: '2022-11-08T19:35:28.366Z'
                        backorderable: false
                        deleted_at: null
                        public_metadata: {}
                        private_metadata: {}
                        is_available: false
                      relationships:
                        stock_location:
                          data:
                            id: '160'
                            type: stock_location
                        variant:
                          data:
                            id: '276'
                            type: variant
              schema:
                $ref: '#/components/schemas/resource'
        '422':
          description: Invalid request
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: Stock location can't be blank and Variant can't be blank
                    errors:
                      stock_location:
                      - can't be blank
                      variant:
                      - can't be blank
              schema:
                $ref: '#/components/schemas/validation_errors'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_stock_item_params'
  /api/v2/platform/stock_items/{id}:
    get:
      summary: Return a Stock Item
      tags:
      - Stock Items
      security:
      - bearer_auth: []
      description: Returns a Stock Item
      operationId: show-stock-item
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: include
        in: query
        description: 'Select which associated resources you would like to fetch, see: <a href="https://jsonapi.org/format/#fetching-includes">https://jsonapi.org/format/#fetching-includes</a>'
        example: stock_location,variant
        schema:
          type: string
      responses:
        '200':
          description: Record found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                      id: '287'
                      type: stock_item
                      attributes:
                        count_on_hand: 10
                        created_at: '2022-11-08T19:35:28.695Z'
                        updated_at: '2022-11-08T19:35:28.707Z'
                        backorderable: true
                        deleted_at: null
                        public_metadata: {}
                        private_metadata: {}
                        is_available: true
                      relationships:
                        stock_location:
                          data:
                            id: '162'
                            type: stock_location
                        variant:
                          data:
                            id: '277'
                            type: variant
              schema:
                $ref: '#/components/schemas/resource'
        '404':
          description: Record not found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The resource you were looking for could not be found.
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
    patch:
      summary: Update a Stock Item
      tags:
      - Stock Items
      security:
      - bearer_auth: []
      description: Updates a Stock Item
      operationId: update-stock-item
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: include
        in: query
        description: 'Select which associated resources you would like to fetch, see: <a href="https://jsonapi.org/format/#fetching-includes">https://jsonapi.org/format/#fetching-includes</a>'
        example: stock_location,variant
        schema:
          type: string
      responses:
        '200':
          description: Record updated
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                      id: '291'
                      type: stock_item
                      attributes:
                        count_on_hand: 200
                        created_at: '2022-11-08T19:35:29.347Z'
                        updated_at: '2022-11-08T19:35:29.598Z'
                        backorderable: true
                        deleted_at: null
                        public_metadata: {}
                        private_metadata: {}
                        is_available: true
                      relationships:
                        stock_location:
                          data:
                            id: '166'
                            type: stock_location
                        variant:
                          data:
                            id: '279'
                            type: variant
              schema:
                $ref: '#/components/schemas/resource'
        '422':
          description: Invalid request
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: Variant can't be blank
                    errors:
                      variant:
                      - can't be blank
              schema:
                $ref: '#/components/schemas/validation_errors'
        '404':
          description: Record not found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The resource you were looking for could not be found.
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_stock_item_params'
    delete:
      summary: Delete a Stock Item
      tags:
      - Stock Items
      security:
      - bearer_auth: []
      description: Deletes a Stock Item
      operationId: delete-stock-item
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Record deleted
        '404':
          description: Record not found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The resource you were looking for could not be found.
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
components:
  schemas:
    resource_properties:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
        relationships:
          type: object
      required:
      - id
      - type
      - attributes
      x-internal: false
    update_stock_item_params:
      type: object
      properties:
        stock_item:
          type: object
          required:
          - variant_id
          - stock_location_id
          - count_on_hand
          properties:
            variant_id:
              type: string
              example: '2'
            stock_location_id:
              type: string
              example: '2'
            count_on_hand:
              type: number
              example: 200
            backorderable:
              type: boolean
              example: true
              default: false
      required:
      - stock_item
      x-internal: false
    resources_list:
      type: object
      properties:
        data:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/resource_properties'
        meta:
          type: object
          properties:
            count:
              type: integer
            total_count:
              type: integer
            total_pages:
              type: integer
          required:
          - count
          - total_count
          - total_pages
        links:
          type: object
          properties:
            self:
              type: string
            next:
              type: string
            prev:
              type: string
            last:
              type: string
            first:
              type: string
          required:
          - self
          - next
          - prev
          - last
          - first
      required:
      - data
      - meta
      - links
      x-internal: false
    validation_errors:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
      required:
      - error
      - errors
      x-internal: false
    create_stock_item_params:
      type: object
      properties:
        stock_item:
          type: object
          required:
          - variant_id
          - stock_location_id
          - count_on_hand
          properties:
            variant_id:
              type: string
              example: '2'
            stock_location_id:
              type: string
              example: '2'
            count_on_hand:
              type: number
              example: 200
            backorderable:
              type: boolean
              example: true
              default: false
      required:
      - stock_item
      x-internal: false
    resource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/resource_properties'
      required:
      - data
      x-internal: false
    error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      x-internal: false
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
