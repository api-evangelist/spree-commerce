openapi: 3.2.0
info:
  title: Platform States API
  contact:
    name: Vendo Connect Inc.
    url: https://getvendo.com
    email: sales@getvendo.com
  description: Spree Platform API
  version: v2
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
tags:
- name: States
paths:
  /api/v2/platform/states:
    get:
      summary: Returns a list of States
      tags:
      - States
      security:
      - bearer_auth: []
      operationId: states-list
      description: Returns a list of States
      parameters:
      - name: page
        in: query
        example: 1
        schema:
          type: integer
      - name: per_page
        in: query
        example: 50
        schema:
          type: integer
      - name: include
        in: query
        description: 'Select which associated resources you would like to fetch, see: <a href="https://jsonapi.org/format/#fetching-includes">https://jsonapi.org/format/#fetching-includes</a>'
        example: country
        schema:
          type: string
      - name: filter[country_id_eq]
        in: query
        description: ''
        example: '4'
        schema:
          type: string
      responses:
        '200':
          description: Records returned
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                    - id: '230'
                      type: state
                      attributes:
                        name: STATE_NAME_230
                        abbr: STATE_ABBR_230
                        updated_at: '2022-11-08T19:35:26.719Z'
                        created_at: '2022-11-08T19:35:26.719Z'
                      relationships:
                        country:
                          data:
                            id: '394'
                            type: country
                    - id: '231'
                      type: state
                      attributes:
                        name: STATE_NAME_231
                        abbr: STATE_ABBR_231
                        updated_at: '2022-11-08T19:35:26.721Z'
                        created_at: '2022-11-08T19:35:26.721Z'
                      relationships:
                        country:
                          data:
                            id: '394'
                            type: country
                    meta:
                      count: 2
                      total_count: 2
                      total_pages: 1
                    links:
                      self: http://www.example.com/api/v2/platform/states?page=1&per_page=&include=&filter[country_id_eq]=
                      next: http://www.example.com/api/v2/platform/states?filter%5Bcountry_id_eq%5D=&include=&page=1&per_page=
                      prev: http://www.example.com/api/v2/platform/states?filter%5Bcountry_id_eq%5D=&include=&page=1&per_page=
                      last: http://www.example.com/api/v2/platform/states?filter%5Bcountry_id_eq%5D=&include=&page=1&per_page=
                      first: http://www.example.com/api/v2/platform/states?filter%5Bcountry_id_eq%5D=&include=&page=1&per_page=
              schema:
                $ref: '#/components/schemas/resources_list'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
  /api/v2/platform/states/{id}:
    get:
      summary: Returns a State
      tags:
      - States
      security:
      - bearer_auth: []
      operationId: show-state
      description: Returns a State
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Record found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    data:
                      id: '234'
                      type: state
                      attributes:
                        name: STATE_NAME_234
                        abbr: STATE_ABBR_234
                        updated_at: '2022-11-08T19:35:27.007Z'
                        created_at: '2022-11-08T19:35:27.007Z'
                      relationships:
                        country:
                          data:
                            id: '396'
                            type: country
              schema:
                $ref: '#/components/schemas/resource'
        '404':
          description: Record not found
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The resource you were looking for could not be found.
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication Failed
          content:
            application/vnd.api+json:
              examples:
                Example:
                  value:
                    error: The access token is invalid
              schema:
                $ref: '#/components/schemas/error'
components:
  schemas:
    resource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/resource_properties'
      required:
      - data
      x-internal: false
    resource_properties:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
        relationships:
          type: object
      required:
      - id
      - type
      - attributes
      x-internal: false
    error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      x-internal: false
    resources_list:
      type: object
      properties:
        data:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/resource_properties'
        meta:
          type: object
          properties:
            count:
              type: integer
            total_count:
              type: integer
            total_pages:
              type: integer
          required:
          - count
          - total_count
          - total_pages
        links:
          type: object
          properties:
            self:
              type: string
            next:
              type: string
            prev:
              type: string
            last:
              type: string
            first:
              type: string
          required:
          - self
          - next
          - prev
          - last
          - first
      required:
      - data
      - meta
      - links
      x-internal: false
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
