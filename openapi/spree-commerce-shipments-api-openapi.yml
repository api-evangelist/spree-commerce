components:
  schemas:
    validation_errors:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
      required:
      - error
      - errors
      x-internal: false
    resource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/resource_properties'
      required:
      - data
      x-internal: false
    resource_properties:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
        relationships:
          type: object
      required:
      - id
      - type
      - attributes
      x-internal: false
    add_item_shipment_params:
      type: object
      properties:
        shipment:
          type: object
          required:
          - variant_id
          properties:
            variant_id:
              type: string
              example: '101'
            quantity:
              type: integer
              example: 2
      required:
      - shipping_category
      x-internal: false
    remove_item_shipment_params:
      type: object
      properties:
        shipment:
          type: object
          required:
          - variant_id
          properties:
            variant_id:
              type: string
              example: '101'
            quantity:
              type: integer
              example: 2
      required:
      - shipping_category
      x-internal: false
    create_shipment_params:
      type: object
      properties:
        shipment:
          type: object
          required:
          - stock_location_id
          - order_id
          - variant_id
          properties:
            stock_location_id:
              type: string
              example: '101'
            order_id:
              type: string
              example: '101'
            variant_id:
              type: string
              example: '101'
            quantity:
              type: integer
              example: 2
      required:
      - shipping_category
      x-internal: false
    resources_list:
      type: object
      properties:
        data:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/resource_properties'
        meta:
          type: object
          properties:
            count:
              type: integer
            total_count:
              type: integer
            total_pages:
              type: integer
          required:
          - count
          - total_count
          - total_pages
        links:
          type: object
          properties:
            self:
              type: string
            next:
              type: string
            prev:
              type: string
            last:
              type: string
            first:
              type: string
          required:
          - self
          - next
          - prev
          - last
          - first
      required:
      - data
      - meta
      - links
      x-internal: false
    update_shipment_params:
      type: object
      properties:
        shipment:
          type: object
          properties:
            tracking:
              type: string
              example: MY-TRACKING-REF-12324
      required:
      - shipping_category
      x-internal: false
    error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      x-internal: false
  securitySchemes:
    api_key:
      type: apiKey
      name: x-spree-api-key
      in: header
      description: Secret API key for admin access
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for admin user authentication
